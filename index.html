<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Voula Evangelia — portfolio</title>
<meta name="description" content="Portfolio of Voula Evangelia, designer & digital artist working at the intersection of space, image and technology — graphic design, posters, identity, motion and 3D.">
<meta property="og:title" content="Voula Evangelia — portfolio">
<meta property="og:description" content="Designer & digital artist working at the intersection of space, image and technology.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f9c3d9">
<script>/* apply the saved light/dark choice before anything paints (no flash) */
  try { if (localStorage.getItem('pf-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  /* back from a project page: the loading screen (turning ✦) shows, then the USB stick reopens */
  try { if (sessionStorage.getItem('pf-return') && sessionStorage.getItem('pf-morph')) document.documentElement.classList.add('returning'); } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#2a1f24; --muted:#6c5360; --accent:#d4447c; --cream:#fff6f2; --aub:#4b1d3f; --aub2:#7d3567;
    --g1:#ffe3d8; --g2:#f9c3d9; --g3:#d9c8ff; --g4:#fbe9f2;
    --serif:"Cormorant Garamond", Georgia, serif; --sans:"Plus Jakarta Sans", system-ui, sans-serif; --mono:"DM Mono", ui-monospace, monospace; --hand:Caveat, cursive;
    --chip-bg:rgba(255,246,242,.55); --chip-bd:rgba(42,31,36,.18); --chip-hover:rgba(255,255,255,.85); --tip-bg:rgba(255,246,242,.8);
  }
  /* dark mode — switched by the glasses */
  :root[data-theme="dark"] {
    --ink:#f5e8ee; --muted:#c3abb8; --accent:#ff8ab6; --cream:#1c1420; --g4:#1a1220;
    --chip-bg:rgba(40,24,36,.6); --chip-bd:rgba(255,230,240,.2); --chip-hover:rgba(74,46,64,.9); --tip-bg:rgba(36,22,32,.88);
  }
  #bg-dark { position:absolute; inset:0; opacity:0; transition:opacity 1.1s ease;
    background:
      radial-gradient(60% 50% at 70% 30%, rgba(255,140,190,.16), rgba(255,140,190,0) 70%),
      radial-gradient(50% 60% at 15% 85%, rgba(150,120,255,.2), rgba(150,120,255,0) 70%),
      linear-gradient(135deg, #26141f 0%, #2b1830 50%, #171430 100%); }
  :root[data-theme="dark"] #bg-dark { opacity:1; }
  :root[data-theme="dark"] #vignette { background:radial-gradient(ellipse at 50% 45%, transparent 50%, rgba(0,0,0,.45) 100%); }
  :root[data-theme="dark"] #veil { background:#141215; }
  html, body, header, #hint { transition:color .8s ease, background-color .8s ease; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; color:var(--ink); background:var(--g4); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  button { font-family:inherit; color:inherit; }

  /* layers */
  #stage { position:fixed; inset:0; transition:filter .9s ease, transform .9s ease; }
  #stage.dim { filter:blur(9px) brightness(.5) saturate(.85); transform:scale(1.03); }
  #bg { position:absolute; inset:0;
    background:
      radial-gradient(60% 50% at 70% 30%, rgba(255,255,255,.75), rgba(255,255,255,0) 70%),
      radial-gradient(50% 60% at 15% 85%, rgba(217,200,255,.9), rgba(217,200,255,0) 70%),
      linear-gradient(135deg, var(--g1) 0%, var(--g2) 45%, var(--g3) 100%); }
  canvas.gl { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #fx { z-index:2; touch-action:none; }
  #vignette { display:none; position:fixed; inset:0; z-index:3; pointer-events:none; background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(90,40,70,.25) 100%); }
  #veil { position:fixed; inset:0; z-index:30; background:#f2f0ed; transition:opacity 2s ease; pointer-events:none; }
  #veil.gone { opacity:0; }

  /* chrome */
  header { position:fixed; z-index:6; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start; padding:20px 24px; pointer-events:none; }
  .name { font-family:var(--serif); font-style:italic; font-weight:500; font-size:36px; line-height:1; letter-spacing:-.01em; }
  .name small { display:block; font-family:var(--sans); font-style:normal; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-top:8px; }
  .chips { display:flex; gap:8px; pointer-events:auto; }
  .chip { font-size:10px; letter-spacing:.14em; text-transform:uppercase; padding:8px 12px; border-radius:99px; border:1px solid var(--chip-bd);
    background:var(--chip-bg); color:var(--ink); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); cursor:pointer; white-space:nowrap; transition:background-color .8s, color .8s, border-color .8s; }
  .chip:hover { background:var(--chip-hover); }
  .chip.icon { padding:0; width:36px; height:32px; display:flex; align-items:center; justify-content:center; }
  .chip.icon svg { width:18px; height:18px; }
  #now { display:none; } #now.on { display:inline-block; }
  /* volume: a small vertical slider that drops out of the speaker on hover / keyboard focus */
  .vol-wrap { position:relative; display:inline-flex; }
  .vol-pop { position:absolute; top:100%; left:50%; padding-top:8px; transform:translateX(-50%) translateY(-4px); opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease, visibility 0s .25s; }
  .vol-wrap:hover .vol-pop, .vol-wrap:focus-within .vol-pop { opacity:1; visibility:visible; pointer-events:auto; transform:translateX(-50%); transition:opacity .25s ease, transform .25s ease, visibility 0s; }
  .vol-pop::before { content:""; position:absolute; left:50%; top:8px; bottom:0; width:36px; transform:translateX(-50%); border-radius:99px; background:var(--chip-bg); border:1px solid var(--chip-bd); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  /* minimal: a thin line, no knob; filled in the opposite theme's ground colour (dark on light, light on dark) */
  .vol-pop .track { position:relative; display:block; width:36px; height:118px; }
  /* the drawn line: a rounded 5px bar, filled from the bottom with a rounded end; the real (invisible) slider sits on top for a comfy hit area */
  .vol-pop .track { --v:80%; --fill:#141215; --rest:rgba(20,18,21,.16); }
  :root[data-theme="dark"] .vol-pop .track { --fill:#f2f0ed; --rest:rgba(242,240,237,.2); }
  .vol-pop .vol-line { position:absolute; padding:0; display:block; left:50%; top:11px; bottom:11px; width:5px; transform:translateX(-50%); border-radius:99px; background:var(--rest); overflow:hidden; pointer-events:none; }
  .vol-pop .vol-line i { position:absolute; left:0; right:0; bottom:0; height:var(--v); min-height:0; border-radius:99px; background:var(--fill); }
  #vol { position:absolute; left:50%; top:50%; width:96px; height:28px; margin:0; transform:translate(-50%,-50%) rotate(-90deg);
    -webkit-appearance:none; appearance:none; background:transparent; cursor:pointer; opacity:0; }
  .vol-pop .track:has(#vol:focus-visible) .vol-line { outline:2px solid var(--accent); outline-offset:3px; }
  @media (hover: none) { .vol-pop { display:none; } }   /* phones: the speaker just mutes / unmutes */
  /* small credit line at the very bottom of an opened item, and a toast for the bag's credit */
  #f-credit { position:absolute; right:24px; bottom:8px; max-width:min(520px, calc(100vw - 48px)); text-align:right; font-size:9.5px; letter-spacing:.08em; opacity:.6; pointer-events:auto; }
  #f-credit a, #toast a { color:inherit; }
  #toast { position:fixed; z-index:9; left:50%; bottom:56px; transform:translate(-50%, 10px); background:rgba(42,31,36,.88); color:#fff6f9; font-size:11px; letter-spacing:.04em;
    padding:9px 14px; border-radius:99px; opacity:0; pointer-events:none; transition:opacity .3s, transform .3s; white-space:nowrap; max-width:calc(100vw - 32px); overflow:hidden; text-overflow:ellipsis; }
  #toast.on { opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
  .act { display:inline-flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .act button, .act a { border:1px solid rgba(255,246,249,.45); background:rgba(255,246,249,.12); border-radius:99px; padding:9px 14px; cursor:pointer; font-size:11px; color:#fff6f9; letter-spacing:.08em; text-decoration:none; font-family:var(--sans); }
  .act button:hover, .act a:hover { background:rgba(255,246,249,.3); }
  #loader { position:fixed; inset:0; z-index:31; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; pointer-events:none; transition:opacity .8s ease; }
  #loader.gone { opacity:0; }
  /* page change: the USB window itself grows to fill the screen and takes the project page's colour; the page then fades in on it */
  @view-transition { navigation:auto; }
  #morph { position:fixed; z-index:40; inset:0; display:none; align-items:center; justify-content:center; pointer-events:none; background:#17101a;
    font:400 11px/1 "DM Mono",monospace; letter-spacing:.18em; text-transform:lowercase; color:rgba(255,240,246,.78); }
  #morph.on { display:flex; }
  /* loading: the site's ✦ turning and breathing, no words. Same mark on the project pages' "back" curtain (view-transition-name keeps it in place across the page change) */
  #loader .t { width:26px; height:26px; color:var(--ink); view-transition-name:moment; }
  #loader .t svg { display:block; width:100%; height:100%; animation:twinkle 1.6s ease-in-out infinite; }
  @keyframes twinkle { 0% { transform:rotate(0) scale(.8); opacity:.55; } 50% { transform:rotate(180deg) scale(1.08); opacity:1; } 100% { transform:rotate(360deg) scale(.8); opacity:.55; } }
  @media (prefers-reduced-motion: reduce) { #loader .t svg { animation:none; } }  /* back from a project: same type as the "opening <file>…" label */
  #loader .bar, #loader .p { display:none; }   /* no progress bar / percentage, just the star */
  #loader .bar { width:180px; height:2px; background:rgba(42,31,36,.12); border-radius:2px; overflow:hidden; }
  #loader .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .3s ease; }
  #loader .p { font-size:10px; letter-spacing:.2em; color:var(--muted); }
  #hint { position:fixed; z-index:6; bottom:22px; left:0; right:0; text-align:center; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); transition:opacity .6s; pointer-events:none; padding:0 16px; }
  #tip { position:fixed; z-index:9; pointer-events:none; font-family:var(--sans); font-style:normal; font-weight:400; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink); background:var(--tip-bg); padding:7px 13px 7px 15px; border-radius:99px; transform:translate(16px,12px); opacity:0; transition:opacity .2s; white-space:nowrap; }

  /* focus UI */
  #focus-ui { position:fixed; inset:0; z-index:7; pointer-events:none; opacity:0; visibility:hidden; transition:opacity .6s ease, visibility 0s .6s; color:#fff6f9; }
  #focus-ui.on { opacity:1; visibility:visible; transition:opacity .6s ease .15s, visibility 0s; }

  /* ---- accessibility: text version + keyboard menu ---- */
  .sr-only { position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  #skip { position:fixed; z-index:40; left:16px; top:-60px; background:var(--ink); color:#fff; padding:10px 14px; border-radius:8px; font-size:12px; text-decoration:none; }
  #skip:focus { top:16px; }
  /* object menu: invisible until you Tab into it */
  #kbd-nav { position:fixed; z-index:12; left:50%; top:70px; transform:translateX(-50%); display:flex; flex-wrap:wrap; justify-content:center; gap:6px; width:min(720px, calc(100vw - 32px));
    clip-path:inset(50%); opacity:0; }
  #kbd-nav:focus-within { clip-path:none; opacity:1; }
  #kbd-nav button { border:1px solid var(--chip-bd); background:var(--tip-bg); color:var(--ink); border-radius:99px; padding:8px 12px; font-size:11px; cursor:pointer; letter-spacing:.04em; }
  /* text version: hidden for sighted mouse users, read by screen readers & search engines, shown as a panel when you Tab into it */
  #text-version { position:fixed; z-index:35; inset:0; overflow:auto; background:var(--cream); color:var(--ink); padding:56px max(24px, calc(50vw - 360px)) 80px;
    font-family:var(--sans); font-size:16px; line-height:1.65; clip-path:inset(50%); opacity:0; }
  #text-version:focus-within, #text-version.open { clip-path:none; opacity:1; }
  #text-version h1 { font-family:var(--serif); font-style:italic; font-weight:500; font-size:48px; line-height:1.05; margin:0 0 12px; }
  #text-version h2 { font-family:var(--sans); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); margin:36px 0 10px; }
  #text-version h3 { font-family:var(--serif); font-size:24px; margin:16px 0 2px; font-weight:600; }
  #text-version ul { padding-left:18px; } #text-version li { margin:4px 0; }
  #text-version .meta { font-family:var(--sans); font-size:12px; color:var(--muted); }
  #text-version a, #text-version button.link { color:var(--accent); background:none; border:0; padding:0; font:inherit; cursor:pointer; text-decoration:underline; }
  #tv-close { position:fixed; top:16px; right:16px; font-family:var(--sans); font-size:12px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration:.01ms !important; animation-duration:.01ms !important; } }
  #focus-ui .top { position:absolute; top:24px; left:0; right:0; text-align:center; font-size:10px; letter-spacing:.3em; text-transform:uppercase; opacity:.8; }
  #close { position:absolute; top:76px; right:24px; width:42px; height:42px; border-radius:50%; border:1px solid rgba(255,246,249,.5); background:rgba(255,246,249,.12);
    font-size:20px; cursor:pointer; pointer-events:auto; color:#fff6f9; z-index:2; display:flex; align-items:center; justify-content:center; padding:0; line-height:0; }
  #close svg, .bar button[data-a=pclose] svg { width:14px; height:14px; display:block; }
  .cap { position:absolute; left:50%; bottom:28px; transform:translateX(-50%); width:min(600px, calc(100vw - 32px)); text-align:center; }
  .cap .kicker { display:none; }
  /* the title is just your label (CV, My work, Contact me…) in the small, minimal caps style */
  .cap h2 { font-family:var(--sans); font-style:normal; font-weight:400; font-size:11px; line-height:1.4; margin:0 0 12px; letter-spacing:.22em; text-transform:uppercase; color:#ffd6e6; }
  .cap .time { display:block; font-family:var(--serif); font-style:italic; font-weight:500; font-size:clamp(40px, 5.6vw, 60px); line-height:1; margin:0 0 8px; font-variant-numeric:tabular-nums; text-shadow:0 2px 30px rgba(212,68,124,.45); }
  .cap .desc { font-family:var(--sans); font-size:14.5px; line-height:1.6; margin:0 auto 10px; max-width:520px; }
  .cap .hint2 { font-size:10px; letter-spacing:.16em; text-transform:uppercase; opacity:.7; margin:8px 0 0; }
  #focus-ui.side .cap { left:28px; bottom:28px; transform:none; text-align:left; width:min(320px, 34vw); }
  #extra { pointer-events:auto; }
  .player { display:inline-flex; flex-direction:column; gap:10px; align-items:center; }
  .player .ctrl { display:flex; gap:8px; }
  .player button { border:1px solid rgba(255,246,249,.45); background:rgba(255,246,249,.12); border-radius:99px; padding:9px 14px; cursor:pointer; font-size:12px; color:#fff6f9; letter-spacing:.08em; }
  .player button:hover { background:rgba(255,246,249,.3); }
  .player ol { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; justify-content:center; gap:6px; }
  .player li button { font-size:10px; text-transform:uppercase; letter-spacing:.12em; padding:6px 10px; }
  .player li button.cur { background:#fff6f9; color:var(--accent); }

  /* side panel (USB desktop / pen note) */
  #side { position:fixed; z-index:8; right:4vw; top:132px; width:min(600px, 54vw); height:calc(100vh - 190px); pointer-events:none; opacity:0; visibility:hidden; transform:translateY(16px) scale(.97);
    transition:opacity .5s ease, transform .5s cubic-bezier(.2,.8,.2,1), visibility 0s .5s; }
  /* the bag's contents: a window listing every object, each one opens from here */
  #bag-panel { position:fixed; z-index:8; right:4vw; top:132px; width:min(380px, calc(100vw - 24px)); max-height:calc(100vh - 190px); display:flex; pointer-events:none; opacity:0; visibility:hidden;
    transform:translateY(16px) scale(.97); transition:opacity .35s ease, transform .35s ease, visibility 0s .35s; }
  #bag-panel.on { opacity:1; visibility:visible; transform:none; pointer-events:auto; transition:opacity .5s ease, transform .5s cubic-bezier(.2,.8,.2,1), visibility 0s; }
  #bag-panel .win { position:relative; inset:auto; width:100%; }
  #bag-panel ul { list-style:none; margin:0; padding:6px; overflow:auto; }
  #bag-panel li button { all:unset; box-sizing:border-box; width:100%; cursor:pointer; display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding:12px 14px; border-radius:8px; }
  #bag-panel li button:hover, #bag-panel li button:focus-visible { background:rgba(212,68,124,.1); }
  #bag-panel li b { display:block; font:500 14px/1.3 var(--sans); color:#2a1f24; }
  #bag-panel li span.lb { display:block; margin-top:3px; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#6c5360; }
  #bag-panel li i { font-style:normal; color:#b9a3ae; font-size:13px; }
  #bag-panel li .row { display:flex; padding:12px 14px; }
  #bag-panel li .cr { margin:2px 0 6px; padding:0 14px 8px; font-size:10px; line-height:1.5; color:#8a7280; }   /* each object's credit, right under it */
  #bag-panel li .cr a { color:inherit; }
  @media (max-width:820px) { #bag-panel { left:12px; right:12px; top:auto; bottom:12px; width:auto; max-height:62vh; } }
  #side.on { opacity:1; visibility:visible; transform:none; pointer-events:auto; transition:opacity .5s ease, transform .5s cubic-bezier(.2,.8,.2,1), visibility 0s; }

  /* the "computer" */
  .win { position:absolute; background:#fdf8f4; border-radius:12px; box-shadow:0 30px 80px rgba(40,10,30,.45), 0 0 0 1px rgba(75,29,63,.25); overflow:hidden; display:flex; flex-direction:column; color:#2a1f24; }
  .win.main { inset:0; }
  .bar { display:flex; align-items:center; gap:10px; padding:9px 12px; background:linear-gradient(90deg,var(--aub),var(--aub2)); color:#ffe9f4; font-size:11px; letter-spacing:.08em; user-select:none; }
  .bar .dots { display:flex; gap:6px; } .bar .dots i { width:11px; height:11px; border-radius:50%; background:#ffb3cf; display:block; } .bar .dots i:nth-child(2){background:#ffe08a} .bar .dots i:nth-child(3){background:#c8f7a8}
  .bar .ttl { flex:1; text-align:center; }
  #bag-panel .bar .ttl { letter-spacing:.18em; font-size:11px; }   /* CONTENTS — spaced caps like the other labels */
  .bar button { background:none; border:0; color:#ffe9f4; font-size:16px; cursor:pointer; line-height:1; padding:0 4px; display:flex; align-items:center; justify-content:center; }
  .bar button[data-a=pclose] svg { width:11px; height:11px; }
  .path { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid rgba(75,29,63,.12); font-size:11px; color:#6c5360; }
  .path button { border:1px solid rgba(75,29,63,.2); background:#fff; border-radius:6px; padding:3px 9px; cursor:pointer; font-size:12px; color:#2a1f24; }
  .path button:disabled { opacity:.35; cursor:default; }
  .files { flex:1; overflow:auto; padding:16px; display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:14px 10px; align-content:start; }
  .file { background:none; border:0; border-radius:8px; padding:8px 6px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:7px; font-size:10.5px; line-height:1.25; text-align:center; word-break:break-all; color:#2a1f24; }
  .file:hover, .file:focus-visible { background:rgba(212,68,124,.12); outline:none; }
  .file .ic { width:72px; height:72px; display:flex; align-items:center; justify-content:center; }
  .file img { max-width:72px; max-height:72px; box-shadow:0 2px 8px rgba(40,10,30,.25); border:3px solid #fff; background:#fff; }
  .file svg { width:70px; height:58px; }
  /* big screens: bigger icons, four to a row (a fifth simply starts the next row) */
  @media (min-width:1100px) and (min-height:640px) {
    .files { grid-template-columns:repeat(4, minmax(0, 1fr)); gap:26px 14px; padding:26px 24px; }
    .file { gap:11px; font-size:12px; padding:12px 8px; min-width:0; }
    .file .ic { width:100%; max-width:168px; height:auto; aspect-ratio:1; }
    .file img { max-width:100%; max-height:100%; border-width:4px; }
    .file svg { width:80%; height:80%; }
  }
  /* "more below" cue: soft fade over the last row + a small bouncing pill, shown only while there is more to scroll */
  .files-wrap { flex:1; min-height:0; position:relative; display:flex; }
  .files-wrap .files, .files-wrap > ul { flex:1; min-width:0; }
  .more { position:absolute; left:0; right:0; bottom:0; height:70px; pointer-events:none; display:flex; align-items:flex-end; justify-content:center; padding-bottom:10px;
    background:linear-gradient(to bottom, rgba(253,248,244,0), #fdf8f4 85%); opacity:0; transition:opacity .3s; }
  .more.on { opacity:1; }
  .more span { pointer-events:auto; cursor:pointer; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#fff6f9; background:#7a2d63; border-radius:99px; padding:6px 13px; box-shadow:0 4px 14px rgba(75,29,63,.3); animation:nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 0%,100% { transform:translateY(0); } 50% { transform:translateY(4px); } }
  @media (prefers-reduced-motion: reduce) { .more span { animation:none; } }

function guilloche(x, w, h, col) {

    else if (!bagOpen) { const p = pick(pickables); if (p) { h = p.item; cur = 'grab'; } }
    if (h !== hovered) {
      hovered = h;
      const showTip = h && h.label && !(isTouch && h.toggle);   // phones: the glasses only show the centred light/dark toast
      tip.style.opacity = showTip ? 1 : 0; if (showTip) tip.textContent = h.label;
      if (h?.focusable && t - lastHoverSfx > .25) { sfx('hover'); lastHoverSfx = t; }
    }
    fx.style.cursor = cur;
  }

  // camera
  const goal = focused ? tmp.set(home.center.x, home.center.y, home.z) : tmp.set(home.center.x + mouse.x * .45, home.center.y + mouse.y * .3, home.z);
  camera.position.lerp(goal, 1 - Math.exp(-(t - introT0 < 4 ? .9 : 2) * dt));
  curLook.lerp(home.center, 1 - Math.exp(-2 * dt)); camera.lookAt(curLook);
  camera.getWorldDirection(dir); up.set(0, 1, 0).applyQuaternion(camera.quaternion); right.set(1, 0, 0).applyQuaternion(camera.quaternion);
  // the tiles are locked to the screen: the camera's parallax / intro zoom moves only the objects, never the background
  const bgDist = home.z - BACKDROP.z;
  for (const p of [tilesLight, tilesDark, studioLight, studioDark]) { p.position.copy(camera.position).addScaledVector(dir, bgDist + (p === tilesDark || p === studioDark ? -.002 : 0)); p.quaternion.copy(camera.quaternion); }
  spot.position.copy(camera.position).addScaledVector(up, 3.5).addScaledVector(dir, 1);
  spot.target.position.copy(camera.position).addScaledVector(dir, bgDist).addScaledVector(up, .6);
  const viewW = 2 * tanH() * SHOW_D * camera.aspect, viewH = 2 * tanH() * SHOW_D;

  for (const it of items) {
    if (it.id.startsWith('deco')) it.group.visible = look !== 'studio';   // studio look: no cartoon confetti
    const ph = it.phase;
    const ik = reduced ? 1 : clamp((t - introT0 - it.delay) / (it === bag ? 2.8 : 1.6), 0, 1), ie = easeOut(ik);
    hf.copy(it.home).add(tmp.set(Math.sin(t * .16 + ph) * .22, Math.sin(t * .2 + ph * 1.7) * .28, Math.sin(t * .12 + ph * .6) * .18).multiplyScalar(reduced ? .2 : 1));
    // intro: the bag rises in, then everything else tumbles out of its opening on a little arc
    let introS = 1, tumble = 0;
    if (it === bag) hf.y -= (1 - ie) * 1.3;
    else if (ik < 1) {
      mouth.copy(bag.group.position).add(MOUTH);
      hf.lerpVectors(mouth, hf, ie); hf.y += 4 * ie * (1 - ie) * 1.6;
      introS = ik > 0 ? .15 + .85 * ie : .001;
      tumble = (1 - ie) * (ph % 2 > 1 ? 3 : -3);
    }

    // spring physics: dragged items follow the pointer with resistance, released ones drift home
    if (drag && drag.item === it) {
      tmp.copy(drag.target).sub(hf); const L = tmp.length();
      if (L > 1e-4) tmp.multiplyScalar(MAXR * Math.tanh(L / MAXR) / L);
      acc.copy(tmp).sub(it.off).multiplyScalar(14 / it.mass).addScaledVector(it.vel, -6.5);
    } else {
      acc.copy(it.off).multiplyScalar(-1 / it.mass).addScaledVector(it.vel, -1.4);
    }
    it.vel.addScaledVector(acc, dt); it.off.addScaledVector(it.vel, dt);
    it.tilt.lerp(tmp.set(-it.vel.y * .12, it.vel.x * .08, -it.vel.x * .12), 1 - Math.exp(-4 * dt));
    pos.copy(hf).add(it.off);
    eul.set(it.homeRot.x + Math.sin(t * .1 + ph) * .14 + it.tilt.x + tumble * .6, it.homeRot.y + Math.sin(t * .08 + ph * 1.3) * .2 + it.tilt.y, it.homeRot.z + Math.sin(t * .07 + ph * .4) * .08 + it.tilt.z + tumble);
    qa.setFromEuler(eul);

    it.hoverW += ((it === hovered ? 1 : 0) - it.hoverW) * (1 - Math.exp(-8 * dt));
    let glow = it.focusable || it.toggle || it.note || it.id === 'bag' ? it.hoverW * (1 - it.focusW) : it.hoverW * .6;
    // the USB stick breathes softly until the visitor has opened it once — "this is where the work is"
    if (it === usb && !workSeen && !focused && ie > .99) glow = Math.max(glow, (.5 - .5 * Math.cos((t - introT0) * 2.4)) * .85);
    setGlow(it, glow);
    it.focusW = approach(it.focusW, it === focused ? 1 : 0, dt / .9);
    const w = easeInOut(it.focusW);
    let s = it.scale * introS * (1 + .05 * it.hoverW);
    if (w > 0) {
      if (!(press && press.mode === 'spin')) {
        if (it.cardSpin) {   // settle on whichever side faces you, don't spring back
          const k = 1 - Math.exp(-5 * dt);
          it.spin.y += (Math.round(it.spin.y / Math.PI) * Math.PI - it.spin.y) * k; it.spin.x *= 1 - k;
        } else it.spin.multiplyScalar(Math.exp(-.7 * dt));
      }
      const sx = portrait ? 0 : it.showX * viewW, lift = portrait && it.panel ? viewH * .27 : it.showLift;
      sp.copy(camera.position).addScaledVector(dir, SHOW_D).addScaledVector(up, lift + (it === focused ? it.scrollY || 0 : 0)).addScaledVector(right, sx);
      const sway = it.still ? 0 : 1;   // reading items stay perfectly still
      e2.set(it.showRot[0] + it.spin.x + Math.sin(t * .5) * .04 * sway, it.showRot[1] + it.spin.y + Math.sin(t * .4) * .07 * sway, it.showRot[2]);
      qb.copy(camera.quaternion).multiply(q2.setFromEuler(e2));
      pos.lerp(sp, w); qa.slerp(qb, w); s = THREE.MathUtils.lerp(s, it.showScale * fitK() * (portrait ? (it.panel ? .7 : 1) * (it.mobK ?? 1) : 1), w);
    }
    it.group.position.copy(pos); it.group.quaternion.copy(qa); it.group.scale.setScalar(s);
    setLayer(it, it === focused || it.focusW > .01 ? 1 : 0);
    it.update?.(dt, t);
  }

  // light / dark: dim and cool the scene lights to match the background
  themeW = approach(themeW, theme === 'dark' ? 1 : 0, dt / 1.1);
  const tw = easeInOut(themeW);
  lights[0].intensity = THREE.MathUtils.lerp(1.1, .55, tw); lights[1].intensity = THREE.MathUtils.lerp(1.8, 1.35, tw); lights[2].intensity = THREE.MathUtils.lerp(.9, 1.3, tw);
  lights[0].groundColor.setHex(0xd8a9c2).lerp(DARK_GROUND, tw);
  scene.environmentIntensity = THREE.MathUtils.lerp(1, .6, tw);
  const studio = look === 'studio';
  tilesDark.material.opacity = tw; tilesDark.visible = !studio && tw > .001; tilesLight.visible = !studio && tw < .999;   // cross-fade light ↔ dark surface
  studioDark.material.opacity = tw; studioDark.visible = studio && tw > .001; studioLight.visible = studio && tw < .999;
  if (studio) {   // studio: calmer, less pink fill; the spot does the shaping
    // dark mode gets less fill and a stronger spot, so the falloff to the edges reads as clearly as in light mode
    lights[0].intensity *= THREE.MathUtils.lerp(.55, .3, tw); lights[1].intensity *= THREE.MathUtils.lerp(.75, .6, tw); lights[2].intensity *= THREE.MathUtils.lerp(.6, .45, tw);
    lights[0].color.setHex(0xfff7f2);
    spot.intensity = THREE.MathUtils.lerp(2.3, 4.2, tw); spot.angle = THREE.MathUtils.lerp(.62, .5, tw); spot.color.setHex(0xfff4ee).lerp(SPOT_DARK, tw);
  } else { lights[0].color.setHex(0xfff2f7); spot.intensity = 0; }

  // render: everything blurred behind, the picked item sharp on top
  scene.environment = envMain; camera.layers.set(0); mainR.render(scene, camera);
  scene.environment = envFx; camera.layers.set(1); fxR.render(scene, camera);
  if (fakeDt === undefined) requestAnimationFrame(frame);
}

/* toast (used for the bag's credit) */
const toastEl = document.getElementById('toast'); let toastTimer = null;
function toast(html, ms = 6000) { toastEl.innerHTML = html; toastEl.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), ms); }

/* ---------- the bag: "contents" — a list of everything in it, each one opens from here */
const BAG_LIST = [   // [item id, what it is, (label, credit ids) for rows that aren't openable objects] — each row carries its own small credit line
  ['card', 'Business card'], ['id', 'ID card'], ['usb', 'USB stick'], ['receipt', 'Receipt'],
  ['walkman', 'Walkman'], ['watch', 'Watch'], ['pen', 'Pen', 'coming soon', ['pen']],['glasses', 'Sunglasses'],
  ['coins', 'Coins', 'spare change', ['coin1', 'coin2']], ['bag', 'The bag', 'holds it all', ['bag']],
];
function bagRow([id, name, label, credits]) {
  const it = items.find(i => i.id === id);
  const cr = (credits || [id]).map(creditHTML).filter(Boolean).join('<br>');
  const crHTML = cr ? `<p class="cr">${cr}</p>` : '';
  if (label) return `<li><div class="row"><span><b>${esc(name)}</b><span class="lb">${esc(label)}</span></span></div>${crHTML}</li>`;
  return it ? `<li><button data-open="${id}"><span><b>${esc(name)}</b><span class="lb">${esc(it.label)}</span></span><i aria-hidden="true">→</i></button>${crHTML}</li>` : '';
}
const bagPanel = document.getElementById('bag-panel');
let bagOpen = false;
function openBag() {
  if (focused) unfocus(true);
  bagPanel.innerHTML = `<div class="win"><div class="bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="ttl">CONTENTS</span>
      <button data-a="bclose" title="Close" aria-label="Close"><svg viewBox="0 0 14 14" aria-hidden="true" style="width:11px;height:11px"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div>
    <div class="files-wrap"><ul>${BAG_LIST.map(bagRow).join('')}</ul><div class="more" aria-hidden="true"><span>scroll for more ↓</span></div></div></div>`;
  bagPanel.classList.add('on'); bagOpen = true;
  const ul = bagPanel.querySelector('ul'), more = bagPanel.querySelector('.more');
  const upd = () => more.classList.toggle('on', ul.scrollHeight - ul.clientHeight - ul.scrollTop > 24);
  ul.addEventListener('scroll', upd, { passive: true }); setTimeout(upd, 100); setTimeout(upd, 700);
  more.querySelector('span').addEventListener('click', () => ul.scrollBy({ top: ul.clientHeight * .7, behavior: 'smooth' }));
  stageEl.classList.add('dim'); hint.style.opacity = 0; tip.style.opacity = 0; sfx('open');
  bagPanel.querySelector('[data-open]')?.focus({ preventScroll: true });
}
function closeBag(silent) {
  if (!bagOpen) return;
  bagOpen = false; bagPanel.classList.remove('on');
  if (!focused) { stageEl.classList.remove('dim'); hint.style.opacity = 1; }
  if (!silent) sfx('close');
}
bagPanel.addEventListener('click', e => {
  if (e.target.closest('[data-a=bclose]')) return closeBag();
  const b = e.target.closest('[data-open]'); if (!b) return;
  const it = items.find(i => i.id === b.dataset.open);
  closeBag(true);
  if (it?.toggle) toggleTheme(); else if (it) focus(it);
});

/* ================================================================ accessibility
   A plain-text version of everything (read by screen readers & search engines, shown when you Tab into it),
   a keyboard menu for the objects, and focus handling for the opened object. */
mainR.domElement.setAttribute('aria-hidden', 'true');
fx.setAttribute('aria-hidden', 'true');
ui.setAttribute('role', 'dialog'); ui.setAttribute('aria-labelledby', 'f-title');
let lastTrigger = null;
{
  const $ = id => document.getElementById(id);
  $('tv-role').textContent = PROFILE.role; $('tv-bio').textContent = PROFILE.bio;
  // work: every project from the USB stick
  $('tv-work').innerHTML = FILES.map(f => f.folder
    ? `<li>${esc(f.folder)}<ul>${f.items.map(p => `<li><button class="link" data-open="${esc(p.img)}">${esc(p.title)}</button> <span class="meta">— ${esc(p.tag)}</span></li>`).join('')}</ul></li>`
    : `<li><button class="link" data-open="${esc(f.img)}">${esc(f.title)}</button> <span class="meta">— ${esc(f.tag)}</span></li>`).join('');
  if ($('tv-note')) $('tv-note').innerHTML =NOTE.lines.filter(Boolean).map(l => `<li>${l.replace(/^\d\.\s*/, '')}</li>`).join('');
  $('tv-cv').innerHTML = CV.sections.map(s => `<h3>${esc(s.title)}</h3><ul>${s.items.map(e =>
    `<li>${e.years ? `<span class="meta">${esc(e.years)}</span> ` : ''}<strong>${esc(e.role)}</strong>, ${esc(e.where)}${e.detail ? ` <span class="meta">(${esc(e.detail)})</span>` : ''}</li>`).join('')}</ul>`).join('')
    + `<h3>Skills</h3><ul>${CV.skills.map(([a, b]) => `<li><strong>${esc(a)}:</strong> ${esc(b)}</li>`).join('')}</ul>`;
  // email is assembled here at runtime, so it still isn't sitting in the HTML source
  const mail = document.createElement('a'); mail.href = 'mailto:' + email(); mail.textContent = email();
  $('tv-contact').append('Email: ', mail);
  $('tv-socials').innerHTML = PROFILE.socials.filter(s => s.url && s.url !== '#').map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)} — ${esc(s.handle)}</a></li>`).join('');
  $('tv-credits').innerHTML = Object.keys(CREDIT).filter(k => creditHTML(k) && !/Designed by/.test(CREDIT[k].by)).map(k => `<li>${creditHTML(k)}</li>`).join('');
  const leaveText = () => { if (document.activeElement && $('text-version').contains(document.activeElement)) document.activeElement.blur(); };
  $('tv-close').onclick = leaveText;
  $('tv-work').addEventListener('click', e => {
    const b = e.target.closest('[data-open]'); if (!b) return;
    leaveText(); openProject(b.dataset.open);
  });
  // keyboard menu of the objects
  const NAMES = { usb: 'USB stick — my work', card: 'Business card — contact', id: 'ID card — about', receipt: 'Receipt — CV',walkman: 'Walkman — music', watch: 'Watch — the time', glasses: 'Glasses — dark / light mode' };
  const nav = $('kbd-nav');
  nav.innerHTML = Object.entries(NAMES).map(([id, n]) => `<button type="button" data-item="${id}">${esc(n)}</button>`).join('') + `<button type="button" data-text>Text version</button>`;
  nav.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.text !== undefined) { $('text-version').focus(); return; }
    if (b.dataset.item === 'glasses') { toggleTheme(); return; }
    lastTrigger = b; focus(items.find(i => i.id === b.dataset.item));
    setTimeout(() => { if (focused) $('close').focus(); }, 650);
  });
}
// open a project straight from the text version: pick up the USB stick, then open the file
function openProject(img) {
  const page = allFiles().find(x => x.img === img)?.href;
  if (page) { location.href = page; return; }
  focus(usb);
  const inFolder = FILES.find(f => f.folder && f.items.some(p => p.img === img));
  setTimeout(() => { if (focused !== usb) return; deskPath = inFolder ? inFolder.folder : null; renderFiles(side); openFile(side, img); side.querySelector('[data-a=pclose]')?.focus(); }, 800);
}

/* header */
document.getElementById('tagline').innerHTML = '<span class="pre">Portfolio — </span>' + esc(PROFILE.role);
document.getElementById('work-btn').onclick = () => focus(usb);

/* loading: reveal the scene only once every model has arrived */
{
  const bar = document.querySelector('#loader .bar i'), pct = document.querySelector('#loader .p');
  const tick = () => {
    const vals = [...loadState.values()], tot = vals.reduce((s, v) => s + (v.total || 1), 0), got = vals.reduce((s, v) => s + (v.done ? (v.total || 1) : Math.min(v.loaded, v.total || 1)), 0);
    const p = tot ? got / tot : 0; bar.style.width = (p * 100).toFixed(0) + '%'; pct.textContent = Math.round(p * 100) + '%';
    if (vals.length && vals.every(v => v.done)) {
      introT0 = simT;
      // coming back from a project page (…/#work): reopen the USB stick where you left off
      let back = null;
      if (document.documentElement.classList.contains('returning')) try { back = JSON.parse(sessionStorage.getItem('pf-morph')); sessionStorage.removeItem('pf-return'); } catch (e) {}
      const toWork = location.hash === '#work';
      if (toWork) history.replaceState(null, '', location.pathname);
      if (back) land(back);
      else { hideMorph(); if (toWork) setTimeout(() => focus(usb), 1600); }
      document.getElementById('loader').classList.add('gone');
      requestAnimationFrame(() => document.getElementById('veil').classList.add('gone'));
    } else requestAnimationFrame(tick);
  };
  tick();
}
clock.start(); requestAnimationFrame(frame);
window.__pf = { items, camera, pickables, get focused() { return focused; }, focus, unfocus,           // DEBUG — remove before launch
  advance(sec) { for (let i = 0; i < sec * 30; i++) frame(0, 1 / 30); } };
</script>
